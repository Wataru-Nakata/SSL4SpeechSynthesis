[project]
name = "ssl4speechsynthesis"
version = "0.1.0"
description = "Add a short description here"
authors = [
    { name = "Wataru Nakata", email = "wataru9871@gmail.com" }
]
dependencies = [
    "descript-audio-codec~=1.0.0",
    "lightning~=2.1.0",
    "hydra-core~=1.3.2",
    "mosaicml-streaming",
    "transformers",
    "webdataset~=0.2.86",
    "pyworld>=0.3.4",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = ["wandb~=0.15.12", "black~=23.10.1", "snakeviz~=2.2.0"]
[tool.hatch.metadata]
allow-direct-references = true
