model:
  dac_bert:
    input_size: 16
    vocab_size: 1024
    bert_config: 
      vocab_size: 30522
      hidden_size: 768
      num_hidden_layers: 12
      num_attention_heads: 12
      intermediate_size: 3072
      hidden_act: "gelu"
      hidden_dropout_prob: 0.1
      attention_probs_dropout_prob:  0.1
      max_position_embeddings: 2048
      initializer_range: 0.02
      layer_norm_eps: 1e-12
      pad_token_id: 0
    n_heads: 2
  dac_path: /home/wnakata/descript-audio-codec/runs/baseline/best/dac/weights.pth

data:
  roots:
   - "/mnt/hdd/datasets/hq-youtube"
  patterns:
   - "**/*.flac"
  batch_size: 8
  num_workers: 8
  sample_rate: 24000

train:
  trainer:
    _target_: lightning.Trainer
    accelerator: "gpu"
    devices: -1
    strategy: "ddp"
    precision: bf16-mixed
    check_val_every_n_epoch: 1
    max_epochs: 3300
  ckpt_path:


